name: tajweed_book_app
description: "A new Flutter project."
publish_to: "none"
version: 1.0.1+8

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get: ^4.7.2
  iconsax: ^0.0.8
  url_launcher: ^6.3.1
  flutter_native_splash: ^2.4.4
  share_plus: ^11.0.0
  logger: ^2.5.0
  shared_preferences: ^2.5.3
  flutter_pdfview: ^1.4.0+1
  path_provider: ^2.1.5
  in_app_update: ^4.2.3
  scrollable_positioned_list: ^0.3.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  # -- Assets --
  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/
    - assets/docs/

  # -- Custom Fonts --
  fonts:
    # -- Primary Font --
    - family: LamaSans
      fonts:
        - asset: assets/fonts/LamaSans/LamaSans-Thin.ttf
          weight: 100
        - asset: assets/fonts/LamaSans/LamaSans-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/LamaSans/LamaSans-Light.ttf
          weight: 300
        - asset: assets/fonts/LamaSans/LamaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/LamaSans/LamaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/LamaSans/LamaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/LamaSans/LamaSans-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/LamaSans/LamaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/LamaSans/LamaSans-Black.ttf
          weight: 900
